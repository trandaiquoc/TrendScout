name: Publish policy pages (manual)

on:
  workflow_dispatch:
    inputs:
      owner_approved:
        description: I reviewed and approved both policy documents for publication
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.owner_approved == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the approved main revision
        uses: actions/checkout@v7

      - name: Reject drafts and unresolved owner placeholders
        shell: bash
        run: |
          set -euo pipefail
          for page in Frontend/public/privacy.html Frontend/public/terms.html; do
            if grep -Eiq 'DRAFT|OWNER REVIEW REQUIRED|OWNER DECISION|\[OWNER' "$page"; then
              echo "Policy publication is blocked: $page still contains a draft marker or owner placeholder."
              exit 1
            fi
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package only the approved policy pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp Frontend/public/privacy.html Frontend/public/terms.html Frontend/public/policy.css _site/
          : > _site/.nojekyll
          test "$(find _site -maxdepth 1 -type f | wc -l)" -eq 4

      - name: Upload policy-only Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main' && inputs.owner_approved == true
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved static policy artifact
        id: deployment
        uses: actions/deploy-pages@v5
