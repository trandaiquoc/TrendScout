[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trendscout-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.16.0",
    "CacheControl==0.14.4",
    "certifi==2026.10.23",
    "cffi==2.1.1",
    "charset-normalizer==3.5.2",
    "click==8.5.1",
    "cryptography==50.0.2",
    "fastapi==0.162.2",
    "fastembed==0.9.1",
    "firebase_admin==7.7.0",
    "google-api-core==2.44.0",
    "google-auth==2.62.1",
    "google-cloud-core==2.8.0",
    "google-cloud-firestore==2.34.1",
    "google-cloud-storage==3.17.1",
    "google-crc32c==1.9.0",
    "google-resumable-media==2.11.0",
    "googleapis-common-protos==1.76.0",
    "grpcio==1.85.1",
    "grpcio-status==1.85.1",
    "h11==0.16.0",
    "h2==4.4.1",
    "hpack==4.2.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "hyperframe==6.1.0",
    "idna==3.20",
    "msgpack==1.2.4",
    "opentelemetry-api==1.45.2",
    "proto-plus==1.29.0",
    "protobuf==7.36.2",
    "pyasn1==0.6.5",
    "pyasn1_modules==0.4.2",
    "pycparser==3.12",
    "pydantic==2.14.3",
    "pydantic_core==2.50.4",
    "PyJWT==2.15.1",
    "requests==2.34.2",
    "starlette==1.10.0",
    "typing-inspection==0.4.5",
    "typing_extensions==4.16.0",
    "tzdata==2026.6",
    "urllib3==2.8.0",
    "uvicorn==0.54.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.fastapi.static]
cdn = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# Existing browser harness contains a compact literal driver; keep its fixture stable.
[tool.ruff.lint.per-file-ignores]
"tests/browser_workspace_offline.py" = ["E701", "E702"]
